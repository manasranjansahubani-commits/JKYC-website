<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notice Management | JKYC</title>

<link rel="stylesheet" href="../css/notice-admin.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/member-approval.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="admin-header">

    <div class="admin-logo">

        <img src="../images/logo.png" alt="Logo">

        <div>

            <h2>Jana Kalyan Youth Club</h2>

            <p>Notice Management Dashboard</p>

        </div>

    </div>

    <div class="admin-right">

        <a href="admin-home.html" class="back-btn">

            <i class="fas fa-arrow-left"></i>

            Back Home

        </a>

    </div>

</header>

<section class="page-title">

    <h1>📢 Notice Management</h1>

    <p>Publish, Edit and Delete Club Notices</p>

</section>

<div class="container">

    <form id="noticeForm">

        <label>Notice Title</label>

        <input
            type="text"
            id="title"
            placeholder="Enter Notice Title"
            required>

        <label>Description</label>

        <textarea
            id="description"
            rows="6"
            placeholder="Write Notice Description"
            required></textarea>

        <label>Date</label>

        <input
            type="date"
            id="date"
            required>

        <button
            type="submit"
            id="saveNotice">

            Publish Notice

        </button>

    </form>

    <hr>

    <h2>All Notices</h2>

    <table>

        <thead>

            <tr>

                <th>Title</th>

                <th>Date</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody id="noticeTable"></tbody>

    </table>

</div>

<footer class="footer">

    <p>© 2026 Jana Kalyan Youth Club | Admin Dashboard</p>

</footer>

<script type="module" src="../js/notice-admin.js"></script>

</body>
</html>
