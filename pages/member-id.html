<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKYC Member ID Card</title>

    <link rel="stylesheet" href="../css/id-card.css">
</head>
<body>

<div class="id-container">

    <div class="id-card">

        <!-- Header -->
        <div class="card-header">

            <div class="logo-box">
                <img src="../images/logo.png" class="logo" alt="JKYC Logo">
            </div>

            <div class="club-details">
                <h2>Jana Kalyan Youth Club</h2>
                <p>Talamandali, Patrapada, Angul, Odisha</p>
            </div>

        </div>

        <!-- Ribbon -->
        <div class="member-ribbon">
            MEMBER ID CARD
        </div>

        <!-- Watermark -->
        <img src="../images/logo.png" class="watermark" alt="Watermark">

        <!-- Member Photo -->
        <div class="photo-box">

            <img id="memberPhoto"
                 src="../images/default-user.png"
                 crossorigin="anonymous">

        </div>

        <!-- Details -->
        <div class="details">

            <h3 id="name">Loading...</h3>

            <div class="detail-row">
                <span>Member ID</span>
                <strong id="memberId"></strong>
            </div>

           <!-- Designation Badge -->
<div class="designation-badge">
    <span id="designation">General Member</span>
</div>

            <div class="detail-row">
                <span>Mobile</span>
                <strong id="mobile"></strong>
            </div>

            <div class="detail-row">
                <span>Occupation</span>
                <strong id="occupation"></strong>
            </div>

            <div class="detail-row">
                <span>Blood Group</span>
                <strong id="bloodGroup"></strong>
            </div>

        </div>

        <!-- QR -->
        <div class="qr-section">

            <div id="qrcode"></div>

            <small>Scan To Verify Member</small>

        </div>

        <!-- Footer -->
        <div class="card-footer">

            <div class="sign">
                President Signature
            </div>

            <div class="seal">
                JKYC Official
            </div>

        </div>

    </div>

</div>

<div class="card-buttons">

    <button id="downloadBtn">
        ⬇️ Download ID Card
    </button>

    <button id="printBtn">
        🖨️ Print ID Card
    </button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="../js/member-id.js"></script>

</body>
</html>
