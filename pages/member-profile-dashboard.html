<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Member Profiles | JKYC Admin</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/member-profile-dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="admin-header">

<div class="admin-logo">

<img src="../images/logo.png" alt="Logo">

<div>

<h2>Jana Kalyan Youth Club</h2>

<p>Member Profile Dashboard</p>

</div>

</div>

<div class="admin-right">

<a href="admin-home.html" class="back-btn">

<i class="fas fa-arrow-left"></i>
Back Home

</a>

</div>

</header>

<section class="page-title">

<h1>Member Profiles</h1>

<p>View, Edit & Manage Club Members</p>

</section>

<div class="dashboard">

<div class="stats">

<div class="card">

<h3>Total Members</h3>

<h2 id="totalMembers">0</h2>

</div>

</div>

<div class="table-box">

<input
type="text"
id="searchInput"
placeholder="Search Member...">

<table>

<thead>

<tr>

<th>Photo</th>
<th>Name</th>
<th>Member ID</th>
<th>Mobile</th>
<th>Occupation</th>
<th>Action</th>

</tr>

</thead>

<tbody id="memberTable">

</tbody>

</table>

</div>

</div>

<script type="module" src="../js/member-profile-dashboard.js"></script>

</body>

</html>
