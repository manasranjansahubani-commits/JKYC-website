<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings | JKYC Admin</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/settings.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="admin-header">

<div class="admin-logo">

<img src="../images/logo.png" alt="Logo">

<div>

<h2>Jana Kalyan Youth Club</h2>

<p>Settings</p>

</div>

</div>

<div class="admin-right">

<a href="admin-home.html" class="back-btn">

<i class="fas fa-arrow-left"></i>

Back Home

</a>

</div>

</header>

<section class="page-title">

<h1>Website Settings</h1>

<p>Manage Website Information</p>

</section>

<div class="settings-box">

<form id="settingsForm">

<label>Club Name</label>
<input type="text" id="clubName">

<label>Address</label>
<input type="text" id="clubAddress">

<label>Mobile</label>
<input type="text" id="clubMobile">

<label>Email</label>
<input type="email" id="clubEmail">

<label>Website</label>
<input type="text" id="clubWebsite">

<label>Facebook Link</label>
<input type="text" id="facebook">

<label>Instagram Link</label>
<input type="text" id="instagram">

<label>YouTube Link</label>
<input type="text" id="youtube">

<button type="submit">

💾 Save Settings

</button>

</form>

</div>

<script type="module" src="../js/settings.js"></script>

</body>
</html>
