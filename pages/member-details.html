<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Profile</title>

<link rel="stylesheet" href="../css/style.css">

<style>
.container{
max-width:700px;
margin:40px auto;
background:#fff;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:20px;
}

.info p{
font-size:18px;
padding:8px 0;
border-bottom:1px solid #ddd;
}
</style>

</head>

<body>

<div class="container">

    <h2>Member Details (Admin)</h2>

    <div class="info">

        <p><strong>Name :</strong> <span id="fullName"></span></p>

        <p><strong>Member ID :</strong> <span id="memberId"></span></p>

        <p><strong>Father Name :</strong> <span id="fatherName"></span></p>

        <p><strong>Mobile :</strong> <span id="mobile"></span></p>

        <p><strong>Email :</strong> <span id="email"></span></p>

        <p><strong>Blood Group :</strong> <span id="bloodGroup"></span></p>

        <p><strong>Occupation :</strong> <span id="occupation"></span></p>

        <p><strong>Address :</strong> <span id="address"></span></p>

        <p><strong>Date of Birth :</strong> <span id="dob"></span></p>

        <br>

        <a id="idCardBtn" class="btn">🆔 Open ID Card</a>

        <a id="editBtn" class="btn">✏️ Edit Member</a>

        <a href="admin.html" class="btn">⬅️ Back Admin</a>

    </div>

</div>

<script type="module" src="../js/member-details.js"></script>
</body>
</html>
