<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Details | Admin</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">

<style>
.member-box{
max-width:850px;
margin:40px auto;
background:#fff;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

.member-top{
display:flex;
align-items:center;
gap:20px;
margin-bottom:25px;
}

.member-top img{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:4px solid #198754;
}

.member-top h2{
margin:0;
}

.details p{
padding:10px 0;
border-bottom:1px solid #ddd;
font-size:17px;
}

.action-btns{
margin-top:25px;
display:flex;
gap:15px;
flex-wrap:wrap;
}
</style>

</head>
<body>

<header class="admin-header">
<div class="admin-logo">
<img src="../images/logo.png">
<div class="club-name">
<h1>Jana Kalyan Youth Club</h1>
<p>Admin Dashboard</p>
</div>
</div>
</header>

<div class="member-box">

<div class="member-top">

<img id="profilePhoto" src="../images/default-user.png">

<div>
<h2 id="fullName">Loading...</h2>
<p id="memberId">Loading...</p>
</div>

</div>

<div class="details">

<p><b>Father Name :</b> <span id="fatherName"></span></p>

<p><b>Mobile :</b> <span id="mobile"></span></p>

<p><b>Email :</b> <span id="email"></span></p>

<p><b>Blood Group :</b> <span id="bloodGroup"></span></p>

<p><b>Occupation :</b> <span id="occupation"></span></p>

<p><b>Address :</b> <span id="address"></span></p>

<p><b>Date Of Birth :</b> <span id="dob"></span></p>

</div>

<div class="action-btns">

<a id="idCardBtn" class="btn">Open ID Card</a>

<a id="editBtn" class="btn">Edit Member</a>

<a href="admin.html" class="btn">Back Admin</a>

</div>

</div>

<script type="module" src="../js/member-details.js"></script>

</body>
</html>
